name: Keep Streamlit Alive

on:
  schedule:
    # 设置为每 10 小时执行一次空提交，完美避开 12 小时的休眠线
    - cron: "0 */10 * * *"
  workflow_dispatch: # 保留这个选项，允许你随时手动点击运行测试

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create empty commit and push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "chore: keep Streamlit app alive to prevent sleep"
          git push
